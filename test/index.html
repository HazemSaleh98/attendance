<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>حضور وانصراف</title>

<style>
html, body { margin: 0; min-height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif; }

.att-root {
    --bg: #f4f2f0;
    --surface: #ffffff;
    --surface2: #f0edeb;
    --ink: #251f21;
    --ink2: #6f6a6c;
    --line: #eae9ea;
    --accent: #0f9d8a;
    --accent2: #0284c7;
    --good: #0f9d8a;
    --warn: #b45309;
    --info: #6d28d9;
    --danger: #dc2626;
    --onaccent: #ffffff;
    --daytint: rgba(245, 158, 11, .16);
    --dayline: rgba(245, 158, 11, .45);
    --nighttint: rgba(99, 102, 241, .14);
    --nightline: rgba(99, 102, 241, .45);
    color-scheme: light;
    background: var(--bg);
    color: var(--ink);
    padding: 20px 16px 28px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: calc(118px + env(safe-area-inset-bottom));
    min-height: 100vh;
    box-sizing: border-box;
    max-width: 600px;
    margin: 0 auto;
    transition: background .3s, color .3s;
}
.att-root[data-theme="dark"] {
    --bg: #0c1322;
    --surface: #151d2f;
    --surface2: #1c2638;
    --ink: #eef1f7;
    --ink2: #8a94a8;
    --line: #232c42;
    --accent: #2ee6a8;
    --accent2: #38bdf8;
    --good: #2ee6a8;
    --warn: #f5b13d;
    --info: #8b7cf6;
    --danger: #e05a7a;
    --onaccent: #06281f;
    --daytint: rgba(245, 177, 61, .14);
    --dayline: rgba(245, 177, 61, .6);
    --nighttint: rgba(139, 124, 246, .18);
    --nightline: rgba(139, 124, 246, .65);
    color-scheme: dark;
}
@media (min-width: 768px) {
    .att-root { padding: 32px 28px calc(118px + env(safe-area-inset-bottom)); }
    .att-monthblock { max-width: 560px; }
}

/* hero */
.att-hero {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 20px;
    padding: 18px 18px 16px;
    color: var(--onaccent);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
}
.att-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.att-hero-title { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.att-toggles { display: flex; gap: 8px; }
.att-toggle {
    min-width: 44px; min-height: 36px; padding: 4px 12px;
    border-radius: 99px; border: 1px solid rgba(255, 255, 255, .45);
    background: rgba(255, 255, 255, .16); color: #fff; font: inherit; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: background .2s, transform .08s;
}
.att-toggle:active { transform: scale(.94); }
.att-hero-sub { margin-top: 4px; font-size: 13px; opacity: .92; font-weight: 600; }
.att-monthrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
.att-month { font-size: 14px; font-weight: 700; }
.att-navbtn {
    min-width: 40px; min-height: 36px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .16);
    color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: background .2s, transform .08s;
}
.att-navbtn:active { transform: scale(.94); }
.att-progress { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .28); overflow: hidden; margin-top: 12px; }
.att-progress > div { height: 100%; border-radius: 99px; background: #fff; transition: width .35s ease; }
.att-progress-label { margin-top: 6px; font-size: 12px; font-weight: 600; opacity: .95; }

/* stats */
.att-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.att-stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 6px; text-align: center; transition: background .3s;
}
.att-stat-num { font-size: 20px; font-weight: 800; line-height: 1.15; }
.att-stat-label { font-size: 11px; color: var(--ink2); margin-top: 2px; }
.att-tone-base { color: var(--ink); }
.att-tone-good { color: var(--good); }
.att-tone-warn { color: var(--warn); }
.att-tone-info { color: var(--info); }

/* calendar */
.att-taphint { font-size: 12px; color: var(--ink2); margin: 18px 2px 8px; text-align: center; }
.att-monthblock { margin-bottom: 12px; }
.att-monthtitle { font-size: 14px; font-weight: 700; margin: 6px 2px 8px; }
.att-weekrow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
.att-weekday { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink2); }
.att-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.att-cell {
    aspect-ratio: 1; border-radius: 14px; border: 1px solid transparent;
    background: transparent; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font: inherit; cursor: pointer; padding: 2px;
    transition: transform .08s, background .2s, border-color .2s;
}
.att-cell:active { transform: scale(.92); }
.att-c-blank { background: transparent; border: none; cursor: default; aspect-ratio: 1; }
.att-c-off { color: var(--ink2); opacity: .5; }
.att-c-day { background: var(--daytint); border-color: var(--dayline); }
.att-c-night { background: var(--nighttint); border-color: var(--nightline); }
.att-c-today { box-shadow: inset 0 0 0 2px var(--accent); }
.att-c-open { box-shadow: inset 0 0 0 2px var(--accent); }
.att-cellnum { font-size: 14px; font-weight: 700; line-height: 1.1; }
.att-cellmark { font-size: 9px; line-height: 1.1; min-height: 10px; }
.att-c-worked { background: var(--accent); border-color: var(--accent); color: var(--onaccent); }
.att-c-worked .att-cellmark { color: var(--onaccent); }
.att-c-short { background: var(--daytint); border-color: var(--warn); }
.att-c-short .att-cellmark { color: var(--warn); font-weight: 700; }
.att-c-checked { background: transparent; border-color: var(--accent); color: var(--accent); }
.att-c-sick { background: var(--surface2); border-color: var(--warn); }
.att-c-swap { background: var(--surface2); border-color: var(--info); }

.att-legend { display: flex; gap: 16px; justify-content: center; margin: 10px 0 4px; }
.att-leg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); font-weight: 600; }
.att-dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.att-d-day { background: var(--daytint); border: 1px solid var(--dayline); }
.att-d-night { background: var(--nighttint); border: 1px solid var(--nightline); }

/* editor */
.att-editor {
    border: 1px solid var(--accent); border-radius: 14px; padding: 14px 12px; margin: 10px 0 8px;
    background: var(--surface); animation: att-rise .22s ease both; transition: background .3s;
}
.att-editor-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.att-editor-title { font-size: 15px; font-weight: 700; }
.att-editor-sub { font-size: 12px; color: var(--ink2); margin-top: 2px; }
.att-iconbtn {
    min-width: 36px; min-height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface2); color: var(--ink2); font: inherit; font-size: 13px; cursor: pointer;
}
.att-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 10px; }
.att-field { flex: 1; min-width: 0; }
.att-label { display: block; font-size: 12px; color: var(--ink2); margin-bottom: 6px; font-weight: 600; }
.att-full { width: 100%; }
.att-time {
    flex: 1; min-width: 0; max-width: 100%; width: 100%; display: block;
    -webkit-appearance: none; appearance: none;
    padding: 10px 12px; font: inherit; font-size: 15px; color: var(--ink);
    background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; min-height: 44px;
    box-sizing: border-box; transition: background .3s;
}
.att-text {
    width: 100%; margin-top: 10px; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink);
    background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; box-sizing: border-box;
    transition: background .3s;
}

/* buttons */
.att-btn {
    padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface2); color: var(--ink); font: inherit; font-weight: 700; font-size: 13px;
    cursor: pointer; min-height: 44px; transition: transform .08s, background .2s, opacity .2s;
}
.att-btn:active { transform: scale(.96); }
.att-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--onaccent); border: none; }
.att-soft { background: var(--surface2); color: var(--accent); border-color: var(--line); }
.att-ghost { background: transparent; }
.att-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.att-block { display: block; width: 100%; }
.att-flex { flex: 1; }
.att-btnrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.att-punchrow { display: flex; gap: 8px; }
.att-punch { min-height: 52px; font-size: 15px; }
.att-or { font-size: 11px; color: var(--ink2); text-align: center; margin: 10px 0 2px; }
.att-error { color: var(--danger); font-size: 12px; margin: 6px 0; font-weight: 600; }
.att-duration { font-size: 13px; font-weight: 700; text-align: center; border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
.att-du-full { background: var(--nighttint); color: var(--accent); }
.att-todayban { font-size: 14px; font-weight: 700; text-align: center; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--nighttint); color: var(--accent); }
.att-du-short { background: var(--daytint); color: var(--warn); }

/* sections, backup, footer */
.att-section { font-size: 14px; font-weight: 700; margin: 20px 2px 10px; }
.att-more { margin: 12px 2px 8px; font-size: 13px; color: var(--ink2); }
.att-topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 8px; }
.att-tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; gap: 4px; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
.att-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--ink2); font: inherit; font-size: 11px; font-weight: 700; padding: 7px 0; border-radius: 12px; cursor: pointer; }
.att-tab.att-tab-on { color: var(--accent); background: var(--nighttint); }
.att-tab-ic { font-size: 18px; line-height: 1; }
.att-big { width: 100%; min-height: 58px; font-size: 17px; margin-bottom: 10px; }
.att-loglist { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.att-logrow { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; color: var(--ink); cursor: pointer; text-align: start; width: 100%; }
.att-logrow-date { font-weight: 700; font-size: 13px; min-width: 70px; }
.att-logrow-info { flex: 1; font-size: 12px; color: var(--ink2); }
.att-logrow-times { font-size: 12px; direction: ltr; color: var(--ink); }
.att-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; transition: background .3s; }
.att-schedrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; }
.att-schedrow + .att-schedrow { border-top: 1px dashed var(--line); }
.att-schedday { font-size: 13px; font-weight: 600; }
.att-schedbtns { display: flex; gap: 6px; }
.att-schedbtn { font-size: 12px; padding: 6px 10px; }
.att-schedhint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.att-iconrow { display: flex; align-items: center; gap: 12px; }
.att-timesrow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.att-timesrow .att-time { flex: 1; min-width: 0; }
.att-iconprev { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); }
.att-hint { font-size: 12px; color: var(--ink2); line-height: 1.7; margin-top: 8px; }
.att-restore {
    width: 100%; margin-top: 10px; padding: 10px 12px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; box-sizing: border-box;
    transition: background .3s;
}
.att-footer { font-size: 11px; color: var(--ink2); text-align: center; margin-top: 28px; }
.att-section-toggle {
    display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none;
    color: var(--ink); font: inherit; cursor: pointer; padding: 0; text-align: start;
}
.att-caret { display: inline-block; font-size: 12px; color: var(--ink2); transition: transform .2s; transform: rotate(90deg); }
[dir="rtl"] .att-caret { transform: rotate(-90deg); }
.att-caret.att-caret-open, [dir="rtl"] .att-caret.att-caret-open { transform: rotate(0deg); }

@keyframes att-rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* reskin: reference look */
.att-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 14px; }
.att-topbar { padding: 16px 2px 4px; }
.att-hero-title { font-size: 19px; }
.att-tab.att-tab-on { color: var(--info); background: var(--nighttint); }
.att-big { width: 100%; min-height: 58px; font-size: 17px; font-weight: 800; border-radius: 14px; background: var(--accent); color: var(--onaccent); border: none; cursor: pointer; font-family: inherit; }
.att-big:active { transform: scale(.98); }
.att-todaycard .att-big { margin-top: 12px; }
.att-punchrow { display: flex; gap: 10px; align-items: stretch; margin-top: 12px; }
.att-punchrow .att-big { flex: 1; margin-top: 0; }
.att-micbtn { width: 58px; min-height: 58px; border-radius: 14px; border: 1.5px solid var(--card2); background: var(--card); color: var(--accent); font-size: 22px; cursor: pointer; font-family: inherit; }
.att-micbtn-on { background: var(--accent); color: var(--onaccent); animation: att-micpulse 1.2s ease-in-out infinite; }
@keyframes att-micpulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.att-voicemsg { margin: 8px 0 0; font-size: 13px; color: var(--accent); line-height: 1.6; }
.att-todaytitle { font-size: 17px; font-weight: 800; }
.att-todaysub { font-size: 13px; color: var(--ink2); margin-top: 4px; }
.att-sumcard .att-monthrow2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.att-sumtitle { font-size: 16px; font-weight: 800; }
.att-navbtn2 { min-width: 40px; min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
.att-sumsub { font-size: 12px; color: var(--ink2); text-align: center; margin-top: 4px; }
.att-stat2row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.att-stat2 { background: var(--surface2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; }
.att-stat2-num { font-size: 22px; font-weight: 800; }
.att-stat2-lbl { font-size: 11px; color: var(--ink2); margin-top: 4px; }
.att-progress2 { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin-top: 14px; }
.att-progress2 > div { height: 100%; border-radius: 99px; background: var(--accent); }
.att-cycnote { font-size: 12px; color: var(--ink2); margin-top: 10px; line-height: 1.7; }
.att-remind { margin-top: 12px; background: var(--surface2); border-radius: 12px; padding: 12px 14px; font-size: 13px; font-weight: 700; border-inline-start: 4px solid var(--info); }
.att-caltitle { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
.att-legendrow { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 12px; font-size: 11px; color: var(--ink2); align-items: center; }
.att-legsq { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 4px; vertical-align: -1px; }
.att-c-day { background: transparent; border: 1.5px solid var(--dayline); }
.att-c-night { background: transparent; border: 1.5px solid var(--nightline); }
.att-c-missed { border: 1.5px dashed var(--danger); }
.att-c-today { box-shadow: inset 0 0 0 2px var(--ink); border-radius: 14px; }
.att-monthcard { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 12px; width: 100%; font: inherit; color: var(--ink); cursor: pointer; text-align: start; }
.att-mc-num { font-size: 26px; font-weight: 800; min-width: 52px; text-align: center; }
.att-mc-num small { display: block; font-size: 11px; font-weight: 600; color: var(--ink2); }
.att-mc-body { flex: 1; }
.att-mc-range { font-size: 14px; font-weight: 800; }
.att-mc-sched { font-size: 11px; color: var(--ink2); margin-top: 3px; }
.att-mc-status { font-size: 11px; color: var(--ink2); margin-top: 3px; }
.att-olderbtn { width: 100%; margin-top: 14px; background: transparent; border: 1.5px dashed var(--line); border-radius: 14px; padding: 13px; color: var(--ink2); font: inherit; font-weight: 700; cursor: pointer; }
.att-monthshead { font-size: 16px; font-weight: 800; margin-top: 10px; }
.att-monthssub { font-size: 12px; color: var(--ink2); margin-top: 6px; line-height: 1.8; }
.att-editor { border-radius: 18px; }

html{-webkit-text-size-adjust:100%}body{touch-action:manipulation}
input,select,textarea{font-size:16px !important}
</style>

<script>
(function () {
'use strict';

/* ---------- helpers ---------- */
var AR_D = '٠١٢٣٤٥٦٧٨٩';
function arDigits(n) { return String(n).replace(/[0-9]/g, function (d) { return AR_D[+d]; }); }
var MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fromKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function nowTime() { var n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); }
function hoursOf(ci, co) {
    if (!ci || !co) return null;
    var a = ci.split(':').map(Number), b = co.split(':').map(Number);
    var mins = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]);
    if (mins <= 0) mins += 24 * 60;
    return Math.round(mins / 6) / 10;
}
function fmtH(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- cycle logic: 16th -> 15th ---------- */
function cycleStartFor(date) {
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    if (d.getDate() >= 16) return new Date(d.getFullYear(), d.getMonth(), 16);
    return new Date(d.getFullYear(), d.getMonth() - 1, 16);
}
function cycleEnd(start) { return new Date(start.getFullYear(), start.getMonth() + 1, 15); }
function isShiftDay(d) { return d.getDay() === 6 || d.getDay() === 0 || d.getDay() === 1; }
function isNight(d) { return d.getDay() === 1; }
function effShift(d) { var v = prefs.pattern[d.getDay()]; return v === 'day' || v === 'night' ? v : null; }
function shiftHours(type) {
    var st = prefs.shiftTimes;
    var h = type === 'night' ? hoursOf(st.nightStart, st.nightEnd) : hoursOf(st.dayStart, st.dayEnd);
    return h === null ? 12 : h;
}
function fmtClock(hhmm) {
    var p = String(hhmm).split(':');
    var h = +p[0];
    var h12 = h % 12 || 12;
    var ap = h < 12 ? (prefs.lang === 'ar' ? 'ص' : 'am') : (prefs.lang === 'ar' ? 'م' : 'pm');
    return h12 + ':' + p[1] + ' ' + ap;
}
function shiftText(t, type) {
    var st = prefs.shiftTimes;
    var base = type === 'night' ? t.legendNight : t.legendDay;
    var s = type === 'night' ? st.nightStart : st.dayStart;
    var e = type === 'night' ? st.nightEnd : st.dayEnd;
    return base + ' ' + t.num(fmtClock(s)) + ' - ' + t.num(fmtClock(e));
}
var REQUIRED = 12;
var WEEK_ORDER = [6, 0, 1, 2, 3, 4, 5];

/* ---------- strings ---------- */
var STR = {

/* ---------- state ---------- */
function loadLS(key, fallback) {
    try {
        var raw = localStorage.getItem(key);
        if (!raw) return fallback;
        var v = JSON.parse(raw);
        return v && typeof v === 'object' ? v : fallback;
    } catch (e) { return fallback; }
}
function saveLS(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
var store = loadLS('attendance.v1', { records: {} });
if (!store.records || typeof store.records !== 'object') store.records = {};
var prefs = loadLS('attendance.prefs.v1', { lang: 'ar', theme: 'dark' });
if (!prefs.pattern || typeof prefs.pattern !== 'object') prefs.pattern = { 0: 'day', 1: 'night', 6: 'day' };
if (!prefs.shiftTimes || typeof prefs.shiftTimes !== 'object') prefs.shiftTimes = { dayStart: '08:00', dayEnd: '20:00', nightStart: '20:00', nightEnd: '08:00' };
if (typeof prefs.workerName !== 'string') prefs.workerName = '';
var viewStart = cycleStartFor(new Date());
var openKey = keyOf(new Date());
var firstRender = true;
var backupOpen = false;
var settingsOpen = false;
var tab = 'today';
var monthsBack = 2;
var voiceMsg = '', listening = false, recog = null;

var schedOpen = false;

/* ---------- calendar helpers ---------- */
function monthSegments(start) {
    var end = cycleEnd(start);
    return [
        { year: start.getFullYear(), month: start.getMonth(), from: 16, to: new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate() },
        { year: end.getFullYear(), month: end.getMonth(), from: 1, to: 15 }
    ];
}
function buildCells(seg) {
    var cells = [];
    var firstDow = new Date(seg.year, seg.month, seg.from).getDay();
    var blanks = WEEK_ORDER.indexOf(firstDow);
    for (var i = 0; i < blanks; i++) cells.push(null);
    for (var d = seg.from; d <= seg.to; d++) {
        var date = new Date(seg.year, seg.month, d);
        cells.push({ key: keyOf(date), date: date, shift: effShift(date) });
    }
    return cells;
}

/* ---------- voice punch ---------- */
function parseVoice(said) {
    var norm = ' ' + String(said || '').toLowerCase() + ' ';
    var wantIn = /دخول/.test(norm) || /check\s*-\s*in|check\s+in|checkin/.test(norm);
    var wantOut = /خروج/.test(norm) || /check\s*-\s*out|check\s+out|checkout/.test(norm);
    if (wantIn && !wantOut) return 'in';
    if (wantOut && !wantIn) return 'out';
    return null;
}
/* ---------- actions ---------- */
function saveRecord(key, r) {
    var next = {};
    Object.keys(store.records).forEach(function (k) { next[k] = store.records[k]; });
    if (r === null) delete next[key]; else next[key] = r;
    store = { records: next };
    saveLS('attendance.v1', store);
    openKey = null;
    ed = null;
    render();
}
function setPrefs(p) {
    if (!p.pattern) p.pattern = prefs.pattern;
    if (!p.shiftTimes) p.shiftTimes = prefs.shiftTimes;
    if (p.workerName === undefined) p.workerName = prefs.workerName;
    prefs = p;
    saveLS('attendance.prefs.v1', prefs);
    render();
}

/* ---------- custom app icon ---------- */
function applyCustomIcon(set) {
    try {
        var sizes = { 'icon-180.png': set.i180, 'icon-192.png': set.i192, 'icon-512.png': set.i512, 'icon-maskable-512.png': set.i512m };
        if ('caches' in window) {
            caches.open('attendance-custom-icons').then(function (c) {
                Object.keys(sizes).forEach(function (name) {
                    c.put(name, new Response(dataUrlToBlob(sizes[name]), { headers: { 'Content-Type': 'image/png' } }));
                });
            });
        }
        var fav = document.querySelector('link[rel="icon"]');
        if (fav) fav.href = set.i192;
        var apple = document.querySelector('link[rel="apple-touch-icon"]');
        if (apple) apple.href = set.i180;
        var man = document.querySelector('link[rel="manifest"]');
        if (man) {
            var base = { name: '\u062d\u0636\u0648\u0631 \u0648\u0627\u0646\u0635\u0631\u0627\u0641', short_name: '\u062d\u0636\u0648\u0631', start_url: '.', scope: '.', display: 'standalone', dir: 'rtl', lang: 'ar', background_color: '#0d131c', theme_color: '#0d131c' };
            base.icons = [
                { src: set.i192, sizes: '192x192', type: 'image/png' },
                { src: set.i512, sizes: '512x512', type: 'image/png' },
                { src: set.i512m, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ];
            man.href = URL.createObjectURL(new Blob([JSON.stringify(base)], { type: 'application/manifest+json' }));
        }
    } catch (e) {}
}
function dataUrlToBlob(d) {
    var parts = d.split(','), mime = parts[0].match(/:(.*?);/)[1];
    var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
}
function makeIcons(file, cb) {
    var img = new Image();
    img.onload = function () {
        var probe = document.createElement('canvas');
        probe.width = 1; probe.height = 1;
        probe.getContext('2d').drawImage(img, 0, 0, 1, 1, 0, 0, 1, 1);
        var px = probe.getContext('2d').getImageData(0, 0, 1, 1).data;
        var bg = 'rgb(' + px[0] + ',' + px[1] + ',' + px[2] + ')';
        var trimmed = trimLogo(img);
        var tw = trimmed.width, th = trimmed.height;
        function draw(size, pad) {
            var cv = document.createElement('canvas');
            cv.width = size; cv.height = size;
            var cx = cv.getContext('2d');
            cx.fillStyle = bg; cx.fillRect(0, 0, size, size);
            var inner = size * (1 - 2 * pad), off = size * pad;
            var scale = Math.min(inner / tw, inner / th);
            var dw = tw * scale, dh = th * scale;
            cx.drawImage(trimmed, off + (inner - dw) / 2, off + (inner - dh) / 2, dw, dh);
            return cv.toDataURL('image/png');
        }
        cb({ i180: draw(180, 0), i192: draw(192, 0), i512: draw(512, 0), i512m: draw(512, 0.1) });
    };
    img.src = URL.createObjectURL(file);
}
if (customIcon) applyCustomIcon(customIcon);

/* ---------- render ---------- */
function render() {
    var lang = prefs.lang === 'en' ? 'en' : 'ar';
    var t = STR[lang];
    var theme = prefs.theme === 'light' ? 'light' : 'dark';
    var records = store.records;
    var start = viewStart;
    var end = cycleEnd(start);
    var todayKey = keyOf(new Date());

    var segs = monthSegments(start).map(function (seg) { return { seg: seg, cells: buildCells(seg) }; });
    var total = 0, worked = 0, sick = 0, swap = 0, hours = 0, openCell = null;
    segs.forEach(function (s) {
        s.cells.forEach(function (c) {
            if (!c) return;
            if (c.shift) total++;
            if (openKey && c.key === openKey) openCell = c;
        });
    });
    Object.keys(records).forEach(function (k) {
        var r = records[k];
        if (!r) return;
        var dt = fromKey(k);
        if (dt < start || dt > end) return;
        var onShift = effShift(dt) !== null;
        if (r.type === 'work' && (r.checkIn || r.checkOut)) {
            if (onShift || r.extra) worked++;
            var h = hoursOf(r.checkIn, r.checkOut);
            if (h !== null && (onShift || r.extra)) hours += h;
        } else if (r.type === 'sick') { if (onShift) sick++; }
        else if (r.type === 'swap') { if (onShift || r.extra) { swap++; worked++; } }
    });
    hours = Math.round(hours * 10) / 10;
    var remain = Math.max(0, REQUIRED - worked);
    var over = Math.max(0, worked - REQUIRED);
    var hoursLeft = Math.max(0, Math.round((REQUIRED * shiftHours('day') - hours) * 10) / 10);
    var pct = Math.min(100, Math.round(worked / REQUIRED * 100));

    function cellClass(c) {
        var r = records[c.key];
        var cls = ['att-cell'];
        if (c.shift === 'day') cls.push('att-c-day');
        else if (c.shift === 'night') cls.push('att-c-night');
        else cls.push('att-c-off');
        if (!r && c.shift && c.key < todayKey) cls.push('att-c-missed');
        if (r) {
            var h = r.type === 'work' ? hoursOf(r.checkIn, r.checkOut) : null;
            if (h !== null && h >= shiftHours(c.shift || 'day')) cls.push('att-c-worked');
            else if (h !== null) cls.push('att-c-short');
            else if (r.type === 'work' && (r.checkIn || r.checkOut)) cls.push('att-c-checked');
            else if (r.type === 'sick') cls.push('att-c-sick');
            else if (r.type === 'swap') cls.push('att-c-swap');
        }
        if (c.key === todayKey) cls.push('att-c-today');
        if (c.key === openKey) cls.push('att-c-open');
        return cls.join(' ');
    }
    function cellMark(c) {
        var r = records[c.key];
        if (r && r.type === 'work') {
            var h = hoursOf(r.checkIn, r.checkOut);
            if (h !== null) return h >= shiftHours(c.shift || 'day') ? '✓' : t.num(fmtH(h)) + '⚠';
            if (r.checkIn) return '•';
        }
        if (r && r.type === 'sick') return '🤒';
        if (r && r.type === 'swap') return '🔄';
        if (c.shift === 'day') return '☀';
        if (c.shift === 'night') return '☾';
        return '';
    }

    var stats = [
        { label: t.total, value: t.num(total), tone: 'att-tone-base' },
        { label: t.worked, value: t.num(worked), tone: 'att-tone-good' },
        { label: t.remain, value: t.num(remain), tone: remain > 0 ? 'att-tone-warn' : 'att-tone-good' },
        { label: t.hoursW, value: t.num(fmtH(hours)), tone: 'att-tone-info' },
        { label: t.hoursL, value: t.num(fmtH(hoursLeft)), tone: hoursLeft > 0 ? 'att-tone-warn' : 'att-tone-good' },

        if (r) {
            if (r.type === 'work') { status = t.xlWork; ci = r.checkIn || ''; co = r.checkOut || ''; var h = hoursOf(r.checkIn, r.checkOut); if (h !== null) hrs = h;
                if ((onShift || r.extra) && (r.checkIn || r.checkOut)) { workedD++; if (h !== null) hoursSum += h; } }
            else if (r.type === 'sick') status = t.xlSick;
            else if (r.type === 'swap') { status = t.xlSwap; col = r.colleague || ''; if (onShift || r.extra) workedD++; }
        }
        days.push([t.fmtDate(d), t.dow(d), shift, status, ci, co, hrs === '' ? '' : t.num(fmtH(hrs)), col]);
    }
    hoursSum = Math.round(hoursSum * 10) / 10;
    var targetH = Math.round(REQUIRED * shiftHours('day') * 10) / 10;
    var diff = Math.round((targetH - hoursSum) * 10) / 10;

    var W = 1240, H = 1754;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var cx = cv.getContext('2d');
    var rtl = lang === 'ar';
    cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, W, H);
    var grad = cx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, '#0d9488'); grad.addColorStop(1, '#0f766e');
    cx.fillStyle = grad; cx.fillRect(0, 0, W, 150);
    cx.fillStyle = '#ffffff';
    cx.textBaseline = 'middle';
    cx.direction = rtl ? 'rtl' : 'ltr';
    cx.textAlign = rtl ? 'right' : 'left';
    var tx = rtl ? W - 40 : 40;
    cx.font = 'bold 44px system-ui, sans-serif';
    cx.fillText(t.title, tx, 58);
    cx.font = '30px system-ui, sans-serif';
    var subLine = prefs.workerName ? prefs.workerName + (lang === 'ar' ? ' — ' : ' - ') + t.cycleTitle(start, end) : t.cycleTitle(start, end);
    cx.fillText(subLine, tx, 112);

    function rr(x, y, w, h, r) {
        cx.beginPath();
        cx.moveTo(x + r, y);
        cx.arcTo(x + w, y, x + w, y + h, r);
        cx.arcTo(x + w, y + h, x, y + h, r);
        cx.arcTo(x, y + h, x, y, r);
        cx.arcTo(x, y, x + w, y, r);
        cx.closePath();
    }
    function fitText(str, x, y, maxW, basePx, weight) {
        var px = basePx;
        cx.font = (weight ? weight + ' ' : '') + px + 'px system-ui, sans-serif';
        while (px > 13 && cx.measureText(str).width > maxW) { px -= 1; cx.font = (weight ? weight + ' ' : '') + px + 'px system-ui, sans-serif'; }
        cx.fillText(str, x, y, maxW);
    }
    function drawRest(logoImg) {
        if (logoImg) {
            var lx = rtl ? 40 : W - 40 - 96;
            rr(lx, 27, 96, 96, 18); cx.fillStyle = '#ffffff'; cx.fill();
            var trimmed = trimLogo(logoImg);
            var tw2 = trimmed.width, th2 = trimmed.height;
            var scale = Math.max(96 / tw2, 96 / th2);
            var dw = tw2 * scale, dh = th2 * scale;
            cx.save();
            rr(lx, 27, 96, 96, 18); cx.clip();
            cx.drawImage(trimmed, lx + (96 - dw) / 2, 27 + (96 - dh) / 2, dw, dh);
            cx.restore();
        }
        var diffLabel = diff > 0 ? t.xlShort : diff < 0 ? t.xlOver : t.done;
        var diffVal = diff === 0 ? '' : t.num(fmtH(Math.abs(diff)));
        var cards = [
            [t.xlSumDays, t.num(workedD) + ' / ' + t.num(REQUIRED)],
            [t.xlSumHours, t.num(fmtH(hoursSum)) + ' / ' + t.num(fmtH(targetH))],
            [diffLabel, diffVal]
        ];
        var gap = 20, cw = (W - 80 - gap * 2) / 3;
        for (var ci2 = 0; ci2 < 3; ci2++) {
            var cx0 = rtl ? W - 40 - (ci2 + 1) * cw - ci2 * gap : 40 + ci2 * (cw + gap);
            rr(cx0, 180, cw, 108, 16); cx.fillStyle = '#f0fdfa'; cx.fill();
            cx.fillStyle = '#0f766e'; cx.font = '26px system-ui, sans-serif'; cx.textAlign = 'center';
            cx.fillText(cards[ci2][0], cx0 + cw / 2, 216);
            cx.fillStyle = '#111827'; cx.font = 'bold 36px system-ui, sans-serif';
            cx.fillText(cards[ci2][1], cx0 + cw / 2, 258);
        }
        var heads = [t.xlHead[0], t.xlHead[1], t.xlHead[2], t.xlHead[3], t.xlHead[4], t.xlHead[5], t.xlHead[6], t.xlHead[7]];
        var widths = [120, 120, 300, 110, 100, 100, 80, 230];
        var tableW = widths.reduce(function (a, b) { return a + b; }, 0);
        var x0 = rtl ? W - 40 : 40;
        var y = 320;
        cx.font = 'bold 24px system-ui, sans-serif';
        cx.fillStyle = '#0f766e';
        var acc = 0;
        for (var c2 = 0; c2 < heads.length; c2++) {
            var wcol = widths[c2];
            var hx = rtl ? x0 - acc - wcol : x0 + acc;
            cx.fillRect(hx, y, wcol, 46);
            cx.fillStyle = '#ffffff'; cx.textAlign = 'center';
            fitText(heads[c2], hx + wcol / 2, y + 24, wcol - 10, 24, 'bold');
            cx.fillStyle = '#0f766e';
            acc += wcol;
        }
        y += 46;
        cx.font = '24px system-ui, sans-serif';
        for (var r2 = 0; r2 < days.length; r2++) {
            var row = days[r2];
            if (r2 % 2 === 0) { cx.fillStyle = '#f4f7f6'; cx.fillRect(rtl ? x0 - tableW : x0, y, tableW, 42); }
            var stColor = row[3] === t.xlWork ? '#16a34a' : row[3] === t.xlSick ? '#dc2626' : row[3] === t.xlSwap ? '#7c3aed' : '#9ca3af';
            var acc2 = 0;
            for (var c3 = 0; c3 < row.length; c3++) {
                var wcol2 = widths[c3];
                var hx2 = rtl ? x0 - acc2 - wcol2 : x0 + acc2;
                cx.fillStyle = c3 === 3 ? stColor : '#1f2937';
                cx.textAlign = 'center';
                fitText(String(row[c3]), hx2 + wcol2 / 2, y + 22, wcol2 - 12, 24);
                acc2 += wcol2;
            }
            y += 42;
        }
        cx.fillStyle = '#94a3b8'; cx.font = '22px system-ui, sans-serif'; cx.textAlign = 'center'; cx.direction = 'ltr';
        cx.fillText(t.footer, W / 2, H - 30);
        var blob = pdfFromCanvas(cv);
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'attendance-' + start.getFullYear() + '-' + pad(start.getMonth() + 1) + '.pdf';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    var logoImg = new Image();
    logoImg.onload = function () { drawRest(logoImg); };
    logoImg.onerror = function () { drawRest(null); };
    logoImg.src = customIcon ? customIcon.i192 : 'icon-192.png';
}

render();
if (firstRender) {
    firstRender = false;
    var openEd = document.querySelector('.att-editor');
    if (openEd) setTimeout(function () { openEd.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 150);
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
    });
}
})();
</script>
<script>
['gesturestart','gesturechange','gestureend'].forEach(function(n){[document,window].forEach(function(t){t.addEventListener(n,function(e){e.preventDefault()},{passive:false})})});
document.addEventListener('touchstart',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
</script>
